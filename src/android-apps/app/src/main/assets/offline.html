<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0c0e14;
    background:
      radial-gradient(700px 400px at 10% -10%, rgba(124,108,255,.16), transparent 60%),
      radial-gradient(600px 360px at 100% 0%, rgba(255,107,154,.10), transparent 60%),
      #fafafc;
  }
  .card { max-width: 380px; width: 100%; text-align: center; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 22px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, #7c6cff, #b18cff); box-shadow: 0 12px 30px rgba(124,108,255,.35);
  }
  h1 { margin: 0 0 8px; font-size: 1.35rem; letter-spacing: -.01em; }
  p { margin: 0 0 22px; color: #4b5063; line-height: 1.55; font-size: .95rem; }
  button {
    font: inherit; font-weight: 600; color: #fff; border: 0; cursor: pointer; height: 46px; padding: 0 22px; border-radius: 999px;
    background: linear-gradient(135deg, #7c6cff, #9b7bff); box-shadow: 0 8px 18px rgba(124,108,255,.32);
  }
  button:active { transform: scale(.98); }
  small { display: block; margin-top: 18px; color: #868ca0; font-size: .8rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/>
        <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p><span id="app">This app</span> needs a connection the first time it opens. Your saved data is safe on this device.</p>
    <button type="button" onclick="retry()">Try again</button>
    <small>by Codelove</small>
  </div>
  <script>
    var native = window.CodeloveNative;
    if (native && native.appName) document.getElementById("app").textContent = native.appName();
    function retry() {
      if (native && native.reload) native.reload();
      else location.reload();
    }
    window.addEventListener("online", retry);
  </script>
</body>
</html>
